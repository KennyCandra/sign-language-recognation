<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLR </title>
   <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
</head>

<body>

    <button class="back-btn" onclick="window.location.href='{{ url_for('login') }}'">Back</button>

    <main class="reset-page">

        <div class="reset-card">

            <div class="card-content">
                <h2>Reset Your Password</h2>
                <p>Enter your email address to receive a verification code</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                {% for category, message in messages %}
                <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
                {% endif %}
                {% endwith %}

                <form action="{{ url_for('forget_password') }}" method="POST">

                    <div class="input-group-reset">
                        <label for="email"></label>
                        <input type="email" id="email" name="email" placeholder="Email" required>
                    </div>

                    <button type="submit" class="send-otp-button">Send OTP</button>
                </form>
            </div>

        </div>
    </main>

</body>

</html>
