<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Recognition - SLR</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
    <style>
        body {
            background: linear-gradient(to right, #1f2937, #111827, #000000);
        }
        .card {
            background: rgba(55, 65, 81, 0.93);
            border: 1px solid #4b5563;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            color: #e5e7eb;
        }
        .video-box {
            border-color: #475569;
            background: #1f2937;
        }
        .block .sentence-box {
            background: #1f2937;
            border: 1px solid #475569;
            color: #e5e7eb;
        }
    </style>


</head>

<body>

<button class="back-btn">Back</button>
<button class="history-btn" onclick="window.location.href='{{ url_for('history_page') }}'">History</button>

<div class="tools-toolbar">
    <a href="{{ url_for('open_camera') }}">Letter Detection</a>
    <a href="{{ url_for('text_to_sign') }}">Text to Sign</a>
    <a href="{{ url_for('voice_to_sign') }}">Voice to Sign</a>
    <a href="{{ url_for('learn_sign') }}">Learn Sign</a>
    <a href="{{ url_for('sign_quiz') }}">Sign Quiz</a>
</div>

<div class="page">

    <div class="card">

        <!-- TOP -->
        <div class="top-section">

            <!-- Camera -->
            <div class="video-box">
                <div class="video-placeholder">
                    Camera is off <br>
                    <small>Click Start to begin</small>
                </div>
            </div>

            <!-- Landmarks -->
            <div class="video-box light">
                <div class="video-placeholder">
                    Hand Landmarks<br>
                    <small>Visualization will appear here</small>
                </div>
            </div>

        </div>

        <!-- BOTTOM -->
        <div class="bottom-section">

            <div class="top-controls">
                <div class="char">
                 Character: <strong id="result"></strong>
                </div>


                <div class="buttons">
                    <button class="btn start">Start</button>
                    <button class="btn stop">Stop</button>
                    <button class="btn clear">Clear</button>
                    <button class="btn" id="favorite-camera-btn" style="background:#f59e0b;color:#fff;">Favorite ★</button>
                </div>
            </div>

            <div class="block">
                <div class="label">
                    Sentence:
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="sentence-box">
                    
                </div>
            </div>

            <div class="translate">
                <select id="lang-select">
                    <option>Arabic</option>
                    <option>English</option>
                    <option>French</option>
                    <option>German</option>
                    <option>Spanish</option>
                </select>

                <button class="btn translate-btn">Translate</button>
            </div>

            <div class="block">
                <div class="label">
                    Translation:
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="sentence-box" id="translation-box">
                    
                </div>

                <audio id="tts-audio" controls></audio>
            </div>

        </div>

    </div>

</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const startBtn = document.querySelector('.btn.start');
    const stopBtn = document.querySelector('.btn.stop');
    const backBtn = document.querySelector('.back-btn'); // زر الرجوع
    const clearBtn = document.querySelector('.btn.clear');
    const favoriteCameraBtn = document.getElementById('favorite-camera-btn');
    const videoBox = document.querySelector('.top-section .video-box:first-child');
    const landmarksBox = document.querySelector('.top-section .video-box.light');
    const resultBox = document.getElementById("result");
    const sentenceBox = document.querySelector(".bottom-section .sentence-box");

    let stream = null;
    let videoElement = null;
    let animationId = null;
    let currentSentence = "";
    let lastAutoSavedText = "";

    // Canvas للـ landmarks
    const canvasLandmarks = document.createElement('canvas');
    canvasLandmarks.style.width = "100%";
    canvasLandmarks.style.height = "100%";
    landmarksBox.appendChild(canvasLandmarks);
    const ctxLandmarks = canvasLandmarks.getContext('2d');

    // MediaPipe Hands
    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    let lastPrediction = "";
    let lastPredictionTime = 0;
    const PREDICTION_DELAY = 300; // تأخير بين كل طلب predict

    // Stability tracking - الحرف لازم يثبت عدد فريمات قبل ما يتأكد
    let stablePrediction = "";       // الحرف اللي بيتكرر
    let stableCount = 0;            // عدد المرات اللي اتكرر فيها
    const STABLE_THRESHOLD = 6;     // لازم يثبت 6 مرات (~2 ثواني) قبل التأكيد
    let confirmedPrediction = "";   // آخر حرف اتأكد فعلاً

    hands.onResults(results => {
        canvasLandmarks.width = landmarksBox.clientWidth;
        canvasLandmarks.height = landmarksBox.clientHeight;
        ctxLandmarks.clearRect(0, 0, canvasLandmarks.width, canvasLandmarks.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];

            if (!landmarks || landmarks.length === 0) return;

            // رسم الـ landmarks على الكانفاس
            drawConnectors(ctxLandmarks, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
            drawLandmarks(ctxLandmarks, landmarks, {color: '#FF0000', lineWidth: 1});

            // تأخير بين كل طلب predict
            const now = Date.now();
            if (now - lastPredictionTime < PREDICTION_DELAY) return;
            lastPredictionTime = now;

            try {
                // Normalize landmarks (same as create_dataset.py / test.py)
                const xCoords = landmarks.map(lm => lm.x);
                const yCoords = landmarks.map(lm => lm.y);
                const minX = Math.min(...xCoords);
                const minY = Math.min(...yCoords);

                const normalizedLandmarks = [];
                for (let i = 0; i < landmarks.length; i++) {
                    normalizedLandmarks.push(landmarks[i].x - minX);
                    normalizedLandmarks.push(landmarks[i].y - minY);
                }

                fetch("/predict", {
                    method: "POST",
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({landmarks: normalizedLandmarks})
                })
                .then(res => res.json())
                .then(data => {
                    if (data.prediction) {
                        const char = data.prediction;

                        // Stability check: لو نفس الحرف بيتكرر، زوّد العداد
                        if (char === stablePrediction) {
                            stableCount++;
                        } else {
                            stablePrediction = char;
                            stableCount = 1;
                        }

                        // عرض الحرف الحالي + progress bar
                        const progress = Math.min(stableCount / STABLE_THRESHOLD, 1);
                        if (char !== 'nothing') {
                            resultBox.innerHTML = char + 
                                ' <span style="font-size:12px;color:#9ca3af;">(' + 
                                Math.round(progress * 100) + '%)</span>';
                        } else {
                            resultBox.innerText = '-';
                        }

                        // لو الحرف ثبت كفاية، أكّده وضيفه للجملة
                        if (stableCount >= STABLE_THRESHOLD && char !== 'nothing' && char !== confirmedPrediction) {
                            confirmedPrediction = char;
                            resultBox.innerHTML = '<span style="color:#22c55e;font-weight:bold;">' + char + ' ✓</span>';

                            if (char === 'space') {
                                currentSentence += ' ';
                            } else if (char === 'del') {
                                currentSentence = currentSentence.slice(0, -1);
                            } else {
                                currentSentence += char;
                            }
                            sentenceBox.innerText = currentSentence;

                            // Reset عشان يقدر يكتب نفس الحرف تاني
                            stableCount = 0;
                            stablePrediction = "";
                            confirmedPrediction = "";
                        }
                    }
                })
                .catch(err => console.log("Fetch error:", err));
            } catch (e) {
                console.log("Landmark processing error:", e);
            }
        } else {
            // لو مفيش يد، reset الـ stability
            stablePrediction = "";
            stableCount = 0;
            confirmedPrediction = "";
            resultBox.innerText = '-';
        }
    });

    // Start camera
    async function startCamera() {
        if (stream) return;

        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoElement = document.createElement('video');
            videoElement.autoplay = true;
            videoElement.playsInline = true;
            videoElement.srcObject = stream;

            videoElement.style.position = "absolute";
            videoElement.style.top = "0";
            videoElement.style.left = "0";
            videoElement.style.width = "100%";
            videoElement.style.height = "100%";
            videoElement.style.zIndex = "1";

            videoBox.appendChild(videoElement);

            const placeholder = videoBox.querySelector(".video-placeholder");
            if (placeholder) placeholder.style.display = "none";

            const landmarkPlaceholder = landmarksBox.querySelector(".video-placeholder");
            if (landmarkPlaceholder) landmarkPlaceholder.style.display = "none";

            videoElement.onloadedmetadata = () => detectFrame();
        } catch (err) {
            console.error("Camera Error:", err);
        }
    }

    // Stop camera
    function stopCamera() {
        if (animationId) cancelAnimationFrame(animationId);

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        if (videoElement && videoElement.parentNode === videoBox) {
            videoBox.removeChild(videoElement);
        }

        const placeholder = videoBox.querySelector(".video-placeholder");
        if (placeholder) placeholder.style.display = "flex";

        const landmarkPlaceholder = landmarksBox.querySelector(".video-placeholder");
        if (landmarkPlaceholder) landmarkPlaceholder.style.display = "flex";

        ctxLandmarks.clearRect(0, 0, canvasLandmarks.width, canvasLandmarks.height);
        videoElement = null;
        resultBox.innerText = "-";
    }

    // Detect frame
    async function detectFrame() {
        if (videoElement && stream) {
            await hands.send({image: videoElement});
            animationId = requestAnimationFrame(detectFrame);
        }
    }

    // Listeners
    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", async () => {
        // Auto-save detected text when the user explicitly stops capture.
        await saveCameraLearning(false);
        stopCamera();
    });
    clearBtn.addEventListener("click", () => {
        resultBox.innerText = "-";
        ctxLandmarks.clearRect(0, 0, canvasLandmarks.width, canvasLandmarks.height);
        currentSentence = "";
        sentenceBox.innerText = "";
    });

    async function saveCameraLearning(favorite) {
        const text = currentSentence.trim();
        if (!text) return null;

        lastAutoSavedText = text;

        try {
            const response = await fetch('/save_learning', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({source: 'camera', content: text, favorite: favorite})
            });
            return await response.json();
        } catch (err) {
            return null;
        }
    }

    function saveCameraLearningOnLeave() {
        const text = currentSentence.trim();
        if (!text || text === lastAutoSavedText) return;

        lastAutoSavedText = text;
        const payload = JSON.stringify({source: 'camera', content: text, favorite: false});
        navigator.sendBeacon('/save_learning', new Blob([payload], {type: 'application/json'}));
    }

    favoriteCameraBtn.addEventListener('click', async () => {
        const text = currentSentence.trim();
        if (!text) {
            alert('No detected sentence to favorite yet.');
            return;
        }

        const data = await saveCameraLearning(true);
        if (data && data.status === 'saved') alert('Added to favorites ★');
        else alert((data && data.error) || 'Could not favorite right now.');
    });

    // Back button listener
    if (backBtn) {
        backBtn.addEventListener('click', async () => {
            await saveCameraLearning(false);
            stopCamera(); // وقف الكاميرا أولاً
            if (document.referrer && document.referrer !== "") {
                window.history.back();
            } else {
                window.location.href = '/home';
            }
        });
    }

    window.addEventListener('beforeunload', saveCameraLearningOnLeave);
    window.addEventListener('pagehide', saveCameraLearningOnLeave);
    // ----------------------- Translation -----------------------
    const translateBtn = document.querySelector('.btn.translate-btn');
    const langSelect = document.getElementById('lang-select');
    const translationBox = document.getElementById('translation-box');
    const ttsAudio = document.getElementById('tts-audio');

    translateBtn.addEventListener('click', () => {
        const text = currentSentence.trim();
        const lang = langSelect.value;

        if (!text) {
            translationBox.innerText = "No sentence to translate.";
            return;
        }

        saveCameraLearning(false);

        translateBtn.innerText = "Translating...";
        translateBtn.disabled = true;

        fetch('/translate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: text, lang: lang})
        })
        .then(res => res.json())
        .then(data => {
            if (data.translation) {
                translationBox.innerText = data.translation;

                // جلب الصوت تلقائياً بعد الترجمة
                fetch('/tts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: data.translation, lang: lang})
                })
                .then(res => res.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    ttsAudio.src = url;
                })
                .catch(err => console.log("TTS error:", err));
            } else {
                translationBox.innerText = "Translation failed.";
            }
        })
        .catch(err => {
            console.log("Translate error:", err);
            translationBox.innerText = "Translation failed.";
        })
        .finally(() => {
            translateBtn.innerText = "Translate";
            translateBtn.disabled = false;
        });
    });});
</script>

</body>
</html>
