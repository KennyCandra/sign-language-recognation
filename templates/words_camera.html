<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words Camera - SLR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>
</head>

<body>

<button class="back-btn">Back</button>

<div class="page">

    <div class="card">

        <!-- TOP -->
        <div class="top-section">

            <!-- Camera -->
            <div class="video-box">
                <div class="video-placeholder">
                    Camera is off <br>
                    <small>Click Start to begin</small>
                </div>
            </div>

            <!-- Landmarks -->
            <div class="video-box light">
                <div class="video-placeholder">
                    Hand Landmarks<br>
                    <small>Visualization will appear here</small>
                </div>
            </div>

        </div>

        <!-- BOTTOM -->
        <div class="bottom-section">

            <div class="top-controls">
                <div class="char">
                 Word: <strong id="result">-</strong>
                </div>

                <div class="buttons">
                    <button class="btn start">Start</button>
                    <button class="btn stop">Stop</button>
                    <button class="btn clear">Clear</button>
                </div>
            </div>

            <div class="block">
                <div class="label">
                    Sentence:
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="sentence-box">
                    
                </div>
            </div>

            <div class="translate">
                <select id="lang-select">
                    <option>Arabic</option>
                    <option>English</option>
                    <option>French</option>
                    <option>German</option>
                    <option>Spanish</option>
                </select>

                <button class="btn translate-btn">Translate</button>
            </div>

            <div class="block">
                <div class="label">
                    Translation:
                    <button class="copy-btn">Copy</button>
                </div>

                <div class="sentence-box" id="translation-box">
                    
                </div>

                <audio id="tts-audio" controls></audio>
            </div>



        </div>

    </div>

</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const startBtn = document.querySelector('.btn.start');
    const stopBtn = document.querySelector('.btn.stop');
    const backBtn = document.querySelector('.back-btn');
    const clearBtn = document.querySelector('.btn.clear');
    const videoBox = document.querySelector('.top-section .video-box:first-child');
    const landmarksBox = document.querySelector('.top-section .video-box.light');
    const resultBox = document.getElementById("result");
    const sentenceBox = document.querySelector(".bottom-section .sentence-box");

    let stream = null;
    let videoElement = null;
    let animationId = null;
    let currentSentence = "";

    // Canvas for landmarks
    const canvasLandmarks = document.createElement('canvas');
    canvasLandmarks.style.width = "100%";
    canvasLandmarks.style.height = "100%";
    landmarksBox.appendChild(canvasLandmarks);
    const ctxLandmarks = canvasLandmarks.getContext('2d');

    // MediaPipe Hands
    const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    hands.onResults(results => {
        canvasLandmarks.width = landmarksBox.clientWidth;
        canvasLandmarks.height = landmarksBox.clientHeight;
        ctxLandmarks.clearRect(0, 0, canvasLandmarks.width, canvasLandmarks.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            // Draw all detected hands
            for (const handLandmarks of results.multiHandLandmarks) {
                drawConnectors(ctxLandmarks, handLandmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
                drawLandmarks(ctxLandmarks, handLandmarks, {color: '#FF0000', lineWidth: 1});
            }
        }
    });

    // Start camera
    async function startCamera() {
        if (stream) return;

        try {
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            videoElement = document.createElement('video');
            videoElement.autoplay = true;
            videoElement.playsInline = true;
            videoElement.srcObject = stream;

            videoElement.style.position = "absolute";
            videoElement.style.top = "0";
            videoElement.style.left = "0";
            videoElement.style.width = "100%";
            videoElement.style.height = "100%";
            videoElement.style.zIndex = "1";

            videoBox.appendChild(videoElement);

            const placeholder = videoBox.querySelector(".video-placeholder");
            if (placeholder) placeholder.style.display = "none";

            const landmarkPlaceholder = landmarksBox.querySelector(".video-placeholder");
            if (landmarkPlaceholder) landmarkPlaceholder.style.display = "none";

            videoElement.onloadedmetadata = () => detectFrame();
        } catch (err) {
            console.error("Camera Error:", err);
        }
    }

    // Stop camera
    function stopCamera() {
        if (animationId) cancelAnimationFrame(animationId);

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        if (videoElement && videoElement.parentNode === videoBox) {
            videoBox.removeChild(videoElement);
        }

        const placeholder = videoBox.querySelector(".video-placeholder");
        if (placeholder) placeholder.style.display = "flex";

        const landmarkPlaceholder = landmarksBox.querySelector(".video-placeholder");
        if (landmarkPlaceholder) landmarkPlaceholder.style.display = "flex";

        ctxLandmarks.clearRect(0, 0, canvasLandmarks.width, canvasLandmarks.height);
        videoElement = null;
        resultBox.innerText = "-";
    }

    // Detect frame
    async function detectFrame() {
        if (videoElement && stream) {
            await hands.send({image: videoElement});
            animationId = requestAnimationFrame(detectFrame);
        }
    }

    // Listeners
    startBtn.addEventListener("click", startCamera);
    stopBtn.addEventListener("click", stopCamera);
    clearBtn.addEventListener("click", () => {
        resultBox.innerText = "-";
        ctxLandmarks.clearRect(0, 0, canvasLandmarks.width, canvasLandmarks.height);
        currentSentence = "";
        sentenceBox.innerText = "";
    });

    // Back button
    if (backBtn) {
        backBtn.addEventListener('click', () => {
            stopCamera();
            if (document.referrer && document.referrer !== "") {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        });
    }

    // ----------------------- Translation -----------------------
    const translateBtn = document.querySelector('.btn.translate-btn');
    const langSelect = document.getElementById('lang-select');
    const translationBox = document.getElementById('translation-box');
    const ttsAudio = document.getElementById('tts-audio');

    translateBtn.addEventListener('click', () => {
        const text = currentSentence.trim();
        const lang = langSelect.value;

        if (!text) {
            translationBox.innerText = "No sentence to translate.";
            return;
        }

        translateBtn.innerText = "Translating...";
        translateBtn.disabled = true;

        fetch('/translate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: text, lang: lang})
        })
        .then(res => res.json())
        .then(data => {
            if (data.translation) {
                translationBox.innerText = data.translation;

                fetch('/tts', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({text: data.translation, lang: lang})
                })
                .then(res => res.blob())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    ttsAudio.src = url;
                })
                .catch(err => console.log("TTS error:", err));
            } else {
                translationBox.innerText = "Translation failed.";
            }
        })
        .catch(err => {
            console.log("Translate error:", err);
            translationBox.innerText = "Translation failed.";
        })
        .finally(() => {
            translateBtn.innerText = "Translate";
            translateBtn.disabled = false;
        });
    });

    // ----------------------- Copy Buttons -----------------------
    document.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const textBox = btn.parentElement.nextElementSibling;
            if (textBox && textBox.innerText) {
                navigator.clipboard.writeText(textBox.innerText).then(() => {
                    btn.innerText = "Copied!";
                    setTimeout(() => btn.innerText = "Copy", 1500);
                });
            }
        });
    });
});
</script>

</body>
</html>
