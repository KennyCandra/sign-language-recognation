<body>

<button class="back-btn" onclick="window.location.href='/'">Back</button>
<button class="history-btn" onclick="window.location.href='{{ url_for('history_page') }}'">History</button>

<div class="tools-toolbar">
    <a href="{{ url_for('open_camera') }}">Letter Detection</a>
    <a href="{{ url_for('text_to_sign') }}">Text to Sign</a>
    <a href="{{ url_for('voice_to_sign') }}">Voice to Sign</a>
    <a href="{{ url_for('learn_sign') }}">Learn Sign</a>
    <a href="{{ url_for('sign_quiz') }}">Sign Quiz</a>
</div>

<div class="page">
    <div class="card learn-card">
        <h2 class="learn-title">Learn Sign Words</h2>
        <p class="learn-subtitle">Search for a word to see its ASL video, or pick a useful sentence to learn signs in context</p>

        <div class="mode-toggle">
            <button class="mode-btn active" id="word-mode-btn" onclick="setMode('word')">Single Word</button>
            <button class="mode-btn" id="sentence-mode-btn" onclick="setMode('sentence')">Useful Sentences</button>
        </div>

        <div id="word-mode-section">
            <div class="search-area">
                <input type="text" class="search-input" id="search-input" placeholder="Type a word... (e.g. hello)" autocomplete="off">
                <button class="search-btn" id="search-btn" onclick="doSearch()">Search</button>
                <button class="search-btn" style="background:#f59e0b;" onclick="saveLearnItem(true)">Favorite ★</button>
            </div>
        </div>

        <div id="sentence-mode-section" style="display:none;">
            <div class="search-area">
                <input type="text" class="search-input" id="sentence-search-input" placeholder="Type a sentence... (e.g. I want water)" autocomplete="off">
                <button class="search-btn" onclick="doSentenceSearch()">Search</button>
                <button class="search-btn" style="background:#f59e0b;" onclick="saveLearnItem(true)">Favorite ★</button>
            </div>
            <div class="results-area" id="sentence-results-area"></div>
            <p style="text-align:center;color:#888;font-size:13px;margin-bottom:10px;">Or pick a suggested sentence below:</p>
            <div class="sentences-section" id="sentences-section"></div>
        </div>

        <div class="results-area" id="results-area"></div>
    </div>
</div>

<script>
const videoBaseUrl = {{ video_base_url | tojson }};
function buildVideoUrl(videoId) {
    return videoBaseUrl ? `${videoBaseUrl}/${videoId}.mp4` : `/sign_video/${videoId}`;
}
let currentMode = 'word';
let playingAll = false;
let playAllIndex = 0;

function setMode(mode) {
    currentMode = mode;
    document.getElementById('word-mode-btn').classList.toggle('active', mode === 'word');
    document.getElementById('sentence-mode-btn').classList.toggle('active', mode === 'sentence');
    document.getElementById('word-mode-section').style.display = mode === 'word' ? '' : 'none';
    document.getElementById('sentence-mode-section').style.display = mode === 'sentence' ? '' : 'none';
    document.getElementById('results-area').innerHTML = '';
    document.getElementById('sentence-results-area').innerHTML = '';
    if (mode === 'sentence') loadSentences();
}

function searchWord(word) {
    document.getElementById('search-input').value = word;
    currentMode = 'word';
    document.getElementById('word-mode-btn').classList.add('active');
    document.getElementById('sentence-mode-btn').classList.remove('active');
    document.getElementById('word-mode-section').style.display = '';
    document.getElementById('sentence-mode-section').style.display = 'none';
    doSearch();
    setTimeout(() => {
        document.getElementById('results-area').scrollIntoView({behavior: 'smooth', block: 'start'});
    }, 300);
}

async function saveLearnItem(favorite = false) {
    const wordText = document.getElementById('search-input').value.trim();
    const sentenceText = document.getElementById('sentence-search-input').value.trim();
    const text = currentMode === 'sentence' ? sentenceText : wordText;

    if (!text) {
        alert('Please type something first.');
        return;
    }

    try {
        const response = await fetch('/save_learning', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({source: 'learn-sign', content: text, favorite: favorite})
        });
        const data = await response.json();
        if (response.ok && data.status === 'saved' && favorite) {
            alert('Added to favorites ★');
        } else {
            return;
        }
    } catch (e) {
        if (favorite) alert('Could not favorite right now.');
    }
}

document.getElementById('search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSearch();
});

async function doSearch() {
    const text = document.getElementById('search-input').value.trim();
    if (!text) return;

    const resultsArea = document.getElementById('results-area');
    resultsArea.innerHTML = '<p style="text-align:center;color:#888;">Searching...</p>';

    try {
        const response = await fetch('/search_videos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: text})
        });
        const data = await response.json();

        if (data.status !== 'success' || !data.results || data.results.length === 0) {
            resultsArea.innerHTML = '<p class="no-result">No results found.</p>';
            return;
        }

        renderSingleWords(data.results);
        saveLearnItem(false);
    } catch (err) {
        resultsArea.innerHTML = '<p class="no-result">Error searching. Please try again.</p>';
    }
}

function renderSingleWords(results) {
    const area = document.getElementById('results-area');
    let html = '';

    for (const r of results) {
        html += `<div class="word-result">`;
        html += `<div class="word-header">`;
        html += `<span class="word-name">${r.word}</span>`;
        if (r.found) {
            html += `<span class="word-badge badge-found">${r.video_count} video${r.video_count > 1 ? 's' : ''}</span>`;
        } else {
            html += `<span class="word-badge badge-notfound">Not found</span>`;
        }
        html += `</div>`;

        if (r.found && r.video_id) {
            html += `<div class="video-container">
                <video controls autoplay loop muted playsinline>
                    <source src="${buildVideoUrl(r.video_id)}" type="video/mp4">
                </video>
            </div>`;
            if (r.video_count > 1) {
                html += `<div class="video-nav" id="nav-${r.word}">
                    <button class="video-nav-btn" onclick="changeVideo('${r.word}', -1)" id="prev-${r.word}" disabled>&lt; Prev</button>
                    <span class="video-counter" id="counter-${r.word}">1 / ${r.video_count}</span>
                    <button class="video-nav-btn" onclick="changeVideo('${r.word}', 1)" id="next-${r.word}">Next &gt;</button>
                </div>`;
            }
        } else if (!r.found) {
            html += `<p class="no-result">No tutorial video available for "${r.word}"</p>`;
        }

        html += `</div>`;
    }

    area.innerHTML = html;
}

// Track current video index per word
const videoIndices = {};
const videoLists = {};

async function changeVideo(word, direction) {
    if (!videoLists[word]) {
        const resp = await fetch(`/word_videos/${word}`);
        const data = await resp.json();
        videoLists[word] = data.videos;
        videoIndices[word] = 0;
    }

    const videos = videoLists[word];
    let idx = (videoIndices[word] || 0) + direction;
    if (idx < 0) idx = 0;
    if (idx >= videos.length) idx = videos.length - 1;
    videoIndices[word] = idx;

    const container = document.querySelector(`#nav-${word}`).previousElementSibling;
    container.innerHTML = `<video controls autoplay loop muted playsinline>
        <source src="${buildVideoUrl(videos[idx])}" type="video/mp4">
    </video>`;

    document.getElementById(`counter-${word}`).textContent = `${idx + 1} / ${videos.length}`;
    document.getElementById(`prev-${word}`).disabled = idx === 0;
    document.getElementById(`next-${word}`).disabled = idx === videos.length - 1;
}

function renderSentence(results) {
    const area = document.getElementById('sentence-results-area');
    const foundResults = results.filter(r => r.found);

    let html = '';
    if (foundResults.length > 1) {
        html += `<div class="sentence-play-all">
            <button class="play-all-btn" id="play-all-btn" onclick="playAllSequence()">▶ Play All Words in Sequence</button>
        </div>`;
    }

    html += '<div class="sentence-videos">';
    for (let i = 0; i < results.length; i++) {
        const r = results[i];
        html += `<div class="word-result" id="sentence-word-${i}">`;
        html += `<div class="word-header">`;
        html += `<span class="word-name">${r.word}</span>`;
        if (r.found) {
            html += `<span class="word-badge badge-found">${r.video_count} video${r.video_count > 1 ? 's' : ''}</span>`;
        } else {
            html += `<span class="word-badge badge-notfound">Not found</span>`;
        }
        html += `</div>`;

        if (r.found && r.video_id) {
            html += `<div class="video-container">
                <video id="video-sentence-${i}" muted playsinline preload="auto">
                    <source src="${buildVideoUrl(r.video_id)}" type="video/mp4">
                </video>
            </div>`;
        } else {
            html += `<p class="no-result">No video for "${r.word}"</p>`;
        }
        html += `</div>`;
    }
    html += '</div>';

    area.innerHTML = html;

    // Store results for play-all
    window._sentenceResults = results;
}

async function playAllSequence() {
    const results = window._sentenceResults;
    if (!results) return;

    const btn = document.getElementById('play-all-btn');
    if (playingAll) {
        playingAll = false;
        btn.textContent = '▶ Play All Words in Sequence';
        btn.disabled = false;
        document.querySelectorAll('.playing-highlight').forEach(el => el.classList.remove('playing-highlight'));
        return;
    }

    playingAll = true;
    btn.textContent = '⏹ Stop';

    for (let i = 0; i < results.length; i++) {
        if (!playingAll) break;
        const r = results[i];
        if (!r.found) continue;

        const wordEl = document.getElementById(`sentence-word-${i}`);
        const video = document.getElementById(`video-sentence-${i}`);
        if (!video) continue;

        document.querySelectorAll('.playing-highlight').forEach(el => el.classList.remove('playing-highlight'));
        wordEl.classList.add('playing-highlight');
        wordEl.scrollIntoView({behavior: 'smooth', block: 'center'});

        video.currentTime = 0;
        video.muted = false;
        await video.play();

        await new Promise(resolve => {
            video.onended = resolve;
            setTimeout(resolve, 10000);
        });

        video.muted = true;
    }

    playingAll = false;
    btn.textContent = '▶ Play All Words in Sequence';
    btn.disabled = false;
    document.querySelectorAll('.playing-highlight').forEach(el => el.classList.remove('playing-highlight'));
}

function loadSentences() {
    const container = document.getElementById('sentences-section');
    let html = '';
    for (const s of USEFUL_SENTENCES) {
        html += `<button class="sentence-chip" onclick="playSentence(this, '${s}')">${s}</button>`;
    }
    container.innerHTML = html;
}

document.getElementById('sentence-search-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doSentenceSearch();
});

async function doSentenceSearch() {
    const text = document.getElementById('sentence-search-input').value.trim();
    if (!text) return;

    const resultsArea = document.getElementById('sentence-results-area');
    resultsArea.innerHTML = '<p style="text-align:center;color:#888;">Loading...</p>';

    try {
        const response = await fetch('/search_videos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: text})
        });
        const data = await response.json();
        if (data.status === 'success' && data.results) {
            renderSentence(data.results);
            saveLearnItem(false);
            setTimeout(() => {
                resultsArea.scrollIntoView({behavior: 'smooth', block: 'start'});
            }, 200);
        }
    } catch(e) {
        resultsArea.innerHTML = '<p class="no-result">Error searching. Please try again.</p>';
    }
}

async function playSentence(btn, sentence) {
    document.querySelectorAll('.sentence-chip.active').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sentence-search-input').value = sentence;

    const resultsArea = document.getElementById('sentence-results-area');
    resultsArea.innerHTML = '<p style="text-align:center;color:#888;">Loading...</p>';

    try {
        const response = await fetch('/search_videos', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: sentence})
        });
        const data = await response.json();
        if (data.status === 'success' && data.results) {
            renderSentence(data.results);
            saveLearnItem(false);
            setTimeout(() => {
                resultsArea.scrollIntoView({behavior: 'smooth', block: 'start'});
            }, 200);
        }
    } catch(e) {
        resultsArea.innerHTML = '<p class="no-result">Error loading sentence.</p>';
    }
}
